<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred Enterprise | Quality Electronics & Financial Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.webmanifest?v=2">
    <meta name="theme-color" content="#b45309">
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icons/icon-192.jpg?v=2">
    <link rel="icon" type="image/jpeg" sizes="512x512" href="/icons/icon-512.jpg?v=2">
    <link rel="apple-touch-icon" href="/icons/icon-512.jpg?v=2">
    <style>
        body {
            background: radial-gradient(circle at top, #ffffff 0%, #f8fafc 55%, #eef2f6 100%) !important;
            color: #0f172a;
        }
        .luxury-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(254, 252, 246, 0.98));
            border: 1px solid rgba(180, 83, 9, 0.28);
            border-radius: 18px;
            padding: 24px;
            margin: 22px auto;
            max-width: 960px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .luxury-gold-title {
            background: linear-gradient(90deg, #92400e, #b45309, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.4px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen font-sans pb-20">

    <!-- Header & Business Profile -->
    <header class="bg-white/95 border-b border-amber-600/25 p-4 sticky top-0 z-40 backdrop-blur shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img id="header-profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Business Owner" class="w-12 h-12 rounded-full object-cover border-2 border-amber-600 shadow">
                <div>
                    <h1 class="text-xl font-bold tracking-wide luxury-gold-title">Alfred Enterprise</h1>
                    <p class="text-xs text-slate-600 font-medium">IDA, Kenema City, Sierra Leone | <a href="tel:+23276655025" class="hover:text-amber-800 underline">+23276655025</a></p>
                </div>
            </div>
            <div class="flex items-center gap-2.5 flex-wrap justify-center">
                <button onclick="toggleCartModal()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 shadow transition">
                    🛒 Cart <span id="cart-count" class="bg-white text-amber-800 px-2 py-0.5 rounded-full text-xs font-extrabold">0</span>
                </button>
                <button id="owner-toggle-btn" onclick="toggleOwnerMode()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium text-sm shadow transition">
                    Owner Login
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto p-4 space-y-8 mt-4">

        <!-- Private Owner Management Panel -->
        <section id="owner-panel" class="hidden bg-white border-2 border-emerald-600 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                <h3 class="text-lg font-bold text-emerald-700">🛡️ Owner Management Panel (Private)</h3>
                <button onclick="toggleOwnerMode()" class="text-xs bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-white font-semibold">Exit Owner Mode</button>
            </div>
            <!-- Add New Product Form -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                <h4 class="font-semibold text-sm text-amber-800">Add New Product Online</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-600 font-medium mb-1">Product Name</label>
                        <input type="text" id="new-prod-name" placeholder="e.g. LED Bulb" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-600 font-medium mb-1">Price (NLe)</label>
                        <input type="number" id="new-prod-price" placeholder="e.g. 150" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm text-slate-900">
                    </div>
                </div>
                <button onclick="addNewProduct()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-lg font-bold text-sm shadow transition">ADD NEW PRODUCT</button>
            </div>
        </section>

        <!-- Store Section -->
        <section id="store-section" class="space-y-4">
            <div class="flex justify-between items-center border-b border-amber-600/25 pb-2">
                <h3 class="text-xl font-bold luxury-gold-title pl-2">Available Products</h3>
                <span id="product-count" class="text-xs text-slate-500 font-medium">Loading items...</span>
            </div>
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

    </main>

    <!-- Shopping Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex justify-end backdrop-blur-xs">
        <div class="bg-white border-l border-amber-600/25 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl overflow-y-auto">
            <div class="space-y-4">
                <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                    <h3 class="text-lg font-bold luxury-gold-title">Your Shopping Cart</h3>
                    <button onclick="toggleCartModal()" class="text-slate-500 hover:text-slate-900 font-bold text-lg">✕</button>
                </div>
                <div id="cart-items" class="space-y-3">
                    <p class="text-xs text-slate-500">Your cart is empty.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SESSION_OWNER_KEY = "alfred_ent_owner_key_v1";
        let products = [];
        let cart = [];
        let ownerKey = "";

        try {
            ownerKey = (sessionStorage.getItem(SESSION_OWNER_KEY) || "").trim();
        } catch (e) {}

        function getOwnerHeaders() {
            const cleanKey = (ownerKey || "").trim();
            return {
                "Content-Type": "application/json",
                "x-profile-upload-key": cleanKey,
                "x-owner-upload-key": cleanKey
            };
        }

        function toggleOwnerMode() {
            const panel = document.getElementById("owner-panel");
            const btn = document.getElementById("owner-toggle-btn");
            if (panel.classList.contains("hidden") || !ownerKey) {
                const rawKey = prompt("Enter Owner Login Code:");
                if (!rawKey || !rawKey.trim()) return;
                ownerKey = rawKey.trim();
                try { sessionStorage.setItem(SESSION_OWNER_KEY, ownerKey); } catch (e) {}
                panel.classList.remove("hidden");
                if (btn) btn.innerText = "Owner Mode Active";
                renderProducts();
            } else {
                panel.classList.add("hidden");
                ownerKey = "";
                try { sessionStorage.removeItem(SESSION_OWNER_KEY); } catch (e) {}
                if (btn) btn.innerText = "Owner Login";
                renderProducts();
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch("/.netlify/functions/products");
                if (!res.ok) throw new Error("Could not load products");
                const data = await res.json();
                products = Array.isArray(data.products) ? data.products : [];
                renderProducts();
            } catch (e) {
                document.getElementById("product-count").innerText = "Unable to load items";
            }
        }

        function renderProducts() {
            const grid = document.getElementById("products-grid");
            const countEl = document.getElementById("product-count");
            countEl.innerText = `${products.length} item${products.length === 1 ? "" : "s"}`;

            if (products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-sm text-slate-500 bg-white rounded-2xl border border-slate-200">No products found. Use Owner Login to add items.</div>`;
                return;
            }

            grid.innerHTML = products.map((item, idx) => `
                <div class="bg-white border border-amber-600/25 rounded-2xl p-4 shadow-sm flex flex-col justify-between space-y-3">
                    <div class="space-y-2">
                        <h4 class="font-bold text-slate-900 text-sm">${item.name}</h4>
                        <p class="text-sm font-extrabold text-amber-800">NLe ${item.price || 0}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-100 space-y-2">
                        <button onclick="addToCart(${idx})" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl text-xs font-bold transition">+ Add to Cart</button>
                        ${ownerKey ? `<button onclick="deleteProduct(${idx})" class="w-full bg-red-600 hover:bg-red-500 text-white py-2 rounded-xl text-xs font-bold transition">Delete Product</button>` : ""}
                    </div>
                </div>
            `).join("");
        }

        async function addNewProduct() {
            const name = document.getElementById("new-prod-name").value.trim();
            const price = Number(document.getElementById("new-prod-price").value) || 0;
            if (!name || price <= 0) return alert("Please enter a valid product name and price.");

            try {
                const updatedProducts = [...products, { name, price, category: "General", desc: "" }];
                const res = await fetch("/.netlify/functions/products", {
                    method: "PUT",
                    headers: getOwnerHeaders(),
                    body: JSON.stringify({ products: updatedProducts })
                });
                if (!res.ok) throw new Error("Could not save product");
                products = updatedProducts;
                document.getElementById("new-prod-name").value = "";
                document.getElementById("new-prod-price").value = "";
                renderProducts();
                alert("✓ Product added successfully!");
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function deleteProduct(idx) {
            if (!confirm("Delete this product?")) return;
            try {
                const updatedProducts = products.filter((_, i) => i !== idx);
                const res = await fetch("/.netlify/functions/products", {
                    method: "PUT",
                    headers: getOwnerHeaders(),
                    body: JSON.stringify({ products: updatedProducts })
                });
                if (!res.ok) throw new Error("Failed to delete product");
                products = updatedProducts;
                renderProducts();
            } catch (err) {
                alert(err.message);
            }
        }

        function toggleCartModal() {
            document.getElementById("cart-modal").classList.toggle("hidden");
        }

        function addToCart(idx) {
            const item = products[idx];
            cart.push({ name: item.name, price: item.price, qty: 1 });
            document.getElementById("cart-count").innerText = cart.length;
            alert(`Added ${item.name} to cart!`);
        }

        if (ownerKey) {
            document.getElementById("owner-panel").classList.remove("hidden");
            document.getElementById("owner-toggle-btn").innerText = "Owner Mode Active";
        }

        loadProducts();
    </script>
</body>
</html>
